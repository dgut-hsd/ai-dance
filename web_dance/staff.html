<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>视频管理 · DANCE ARENA</title>
  <link rel="stylesheet" href="/web_dance/staff.css">
</head>
<body>
  <header>
    <h1>DANCE ARENA 后台</h1>
    <nav class="nav">
      <a href="/settings" class="nav-link">游戏设置</a>
      <a href="/studio" class="nav-link">作品工坊</a>
      <a href="/staff" class="nav-link active">高光视频</a>
      <a href="/editor" class="nav-link">谱面编辑</a>
    </nav>
    <a id="back" href="/web_dance/">返回游戏</a>
  </header>

  <section class="toolbar">
    <button id="refresh" class="btn">刷新</button>
    <span id="status"></span>
  </section>

  <main id="jobs"></main>

  <!-- 两个直下二维码：short 高光版 / long 完整版 -->
  <div id="download-modal" class="modal hidden">
    <div class="modal-mask" data-close></div>
    <div class="modal-box">
      <div class="modal-head"><span>选择视频版本</span><button class="modal-close" data-close>✕</button></div>
      <p class="modal-hint">两个二维码都会直接下载，请按需要扫码</p>
      <div class="qr-options">
        <section class="qr-option">
          <strong>SHORT · 传播高光版</strong><span>约 20 秒，适合分享</span>
          <img id="short-qr" class="qr" alt="高光版直接下载二维码">
          <a id="short-link" class="btn" href="#" target="_blank" rel="noopener">电脑下载高光版</a>
        </section>
        <section class="qr-option">
          <strong>LONG · 完整纪念版</strong><span>保留整段真人录像</span>
          <img id="long-qr" class="qr" alt="完整版直接下载二维码">
          <a id="long-link" class="btn" href="#" target="_blank" rel="noopener">电脑下载完整版</a>
          <p id="long-waiting" class="long-waiting" hidden></p>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="/web_dance/staff.js"></script>
</body>
</html>
