<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DANCE ARENA — 3D 舞蹈动捕</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./highlight.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="fx"></canvas>
    <details id="highlight-dock">
      <summary>我的高光 · 录制与领取</summary>
      <label><input id="highlight-consent" type="checkbox">记录我的真人 PK 高光</label>
      <small>开启后录制真人画面与游戏音乐，结束后上传并保留 7 天。持领取码者可观看和下载；此设备可删除视频。</small>
      <details><summary>设备设置</summary>
        <label>设备密钥<input id="highlight-device-token" type="password" autocomplete="off" placeholder="由工作人员填写；本机体验可留空"></label>
      </details>
      <p id="highlight-message" role="status">勾选后开始真人 PK，跳完即可扫码领取。</p>
      <div id="highlight-jobs"></div>
    </details>

    <!-- 顶栏 -->
    <header id="topbar">
      <div id="logo">DANCE<span>ARENA</span></div>
      <a id="btn-home" href="./" title="返回选歌主页">选歌主页</a>
      <nav id="modes">
        <button data-mode="free" class="mode-btn active">自由模式</button>
        <button data-mode="challenge" class="mode-btn">跟跳挑战</button>
        <button data-mode="pk" class="mode-btn">真人 PK</button>
        <button data-mode="performance" class="mode-btn">舞者表演</button>
      </nav>
      <div id="statusbar">
        <span id="status">初始化…</span>
        <span id="fps">-- FPS</span>
        <span id="delegate"></span>
      </div>
    </header>

    <details style="position:fixed;top:65px;left:12px;z-index:30;background:#101522;color:#eee;padding:8px;max-height:65vh;overflow:auto">
      <summary>设备性能（工作人员）</summary>
      <button id="export-perf">导出性能报告</button>
      <pre id="perf-details">开始后自动采样，无需玩家校准。</pre>
    </details>
    <!-- 初始加载提示 -->
    <div id="menu" class="overlay">
      <h1 class="menu-title">正在加载<span>舞者</span></h1>
      <p class="menu-sub">正在准备默认舞者，请稍候…</p>
      <p id="menu-status" class="menu-status"></p>
    </div>

    <!-- 游戏 HUD -->
    <div id="hud" class="hidden">
      <!-- 左下:摄像头 -->
      <div id="cam-panel" class="panel">
        <div class="panel-title">你的动作 <span class="live-dot"></span></div>
        <div id="cam-wrap">
          <video id="cam" autoplay playsinline muted></video>
          <canvas id="cam-stick" width="320" height="240"></canvas>
        </div>
        <div id="conf-bar"><div id="conf-fill"></div></div>
        <div id="conf-label">置信度 --</div>
      </div>

      <!-- 右上:舞蹈动作(Just Dance 式滚动列:当前 + 接下来的动作剪影) -->
      <div id="ref-panel" class="panel hidden">
        <div class="panel-title">舞蹈动作</div>
        <div id="move-scroll">
          <div id="move-now-line"></div>
          <div id="move-track"></div>
        </div>
        <div id="beats">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <!-- 右下:计分(挑战) -->
      <div id="score-panel" class="panel hidden">
        <div id="grade">-</div>
        <div id="score">0</div>
        <div id="score-label">SCORE</div>
        <div id="combo">COMBO <b id="combo-n">0</b></div>
        <div id="acc-ring">
          <canvas id="acc-canvas" width="90" height="90"></canvas>
          <span id="acc-pct">0%</span>
        </div>
        <div id="progress"><div id="progress-fill"></div></div>
      </div>

      <!-- 底部控制条 -->
      <div id="controls">
        <button id="btn-start" class="btn primary" disabled>开始</button>
        <button id="btn-stop" class="btn" disabled>停止</button>
        <button id="btn-mirror" class="btn" title="左右镜像">镜像:开</button>
        <button id="btn-flip" class="btn" title="前后朝向">朝向:正</button>
        <label class="btn">
          <span id="dance-type-label">全身</span>
          <select id="dance-type">
            <option value="full-body">全身舞蹈</option>
            <option value="gesture">手势舞</option>
          </select>
        </label>
        <label class="btn hidden" id="dance-picker">
          <span>舞蹈</span>
          <select id="dance-select"></select>
        </label>
        <label class="btn hidden" id="song-picker">
          <span>歌曲</span>
          <select id="song-select"></select>
        </label>
        <button id="btn-load-ref" class="btn hidden">加载参考 JSON</button>
        <input type="file" id="ref-file" accept="application/json,.json" hidden />
        <label class="btn hidden" id="anim-picker">
          <span>动画</span>
          <select id="anim-select"></select>
        </label>
        <button id="btn-reset" class="btn">重置视角</button>
      </div>
    </div>

    <!-- 判定文字(PERFECT / GREAT / MISS / COMBO) -->
    <div id="judge" class="hidden"></div>

    <!-- 中央提示:倒计时 -->
    <div id="center-msg" class="hidden"><div id="center-msg-text">3</div></div>

    <!-- 结算 -->
    <div id="result" class="overlay hidden">
      <h2 id="result-grade" class="grade-s">S</h2>
      <p id="result-score">得分 0</p>
      <p id="result-acc">平均匹配 0%</p>
      <p id="result-combo">最大连击 0</p>
      <table id="result-tallies">
        <tr><td class="t-perfect">PERFECT</td><td id="tallies-perfect">0</td></tr>
        <tr><td class="t-great">GREAT</td><td id="tallies-great">0</td></tr>
        <tr><td class="t-good">GOOD</td><td id="tallies-good">0</td></tr>
        <tr><td class="t-miss">MISS</td><td id="tallies-miss">0</td></tr>
      </table>
      <button id="result-again" class="btn primary lg">再来一次</button>
      <button id="result-exit" class="btn lg">结束挑战</button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
